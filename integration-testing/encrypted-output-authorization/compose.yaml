services:
  receiver:
    image: python:3.12-alpine
    command:
      - python3
      - /scenario/receiver.py
      - --bind-address
      - 0.0.0.0
      - --port
      - "8080"
      - --expected-authorization
      - ${DECRYPTED_AUTHORIZATION}
      - --state-directory
      - /state
    environment:
      DECRYPTED_AUTHORIZATION: ${DECRYPTED_AUTHORIZATION}
    volumes:
      - ${SCENARIO_DIR}/receiver.py:/scenario/receiver.py:ro
      - ${STATE_DIR}:/state
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  agent:
    image: ${AGENT_IMAGE}
    depends_on:
      receiver:
        condition: service_healthy
    environment:
      BOOTSTRAP_FILE: /config/bootstrap.json
      OPSCOTCH_LEGAL_ACCEPTED: ${OPSCOTCH_LEGAL_ACCEPTED}
      OPSCOTCH_OPTS: --accept-legal=yes
      OPSCOTCH_STRING_SECRETKEYS: ${STRING_SECRET_KEYS}
      TEST_OUTPUT_AUTH: ${ENCRYPTED_AUTHORIZATION}
    volumes:
      - ${FIXTURE_DIR}:/config:ro
      - ${PERSISTENCE_DIR}:/persistence
