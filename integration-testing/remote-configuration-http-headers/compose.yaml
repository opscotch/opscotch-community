services:
  receiver:
    image: python:3.12-alpine
    command:
      - python3
      - /scenario/receiver.py
      - --bind-address
      - 0.0.0.0
      - --port
      - "8080"
      - --workflow-file
      - /fixtures/workflow.json
      - --expected-config-headers
      - /fixtures/expected-config-headers.json
      - --expected-metric-name
      - remote-configuration-http-headers-metric
      - --expected-log-token
      - remote-configuration-http-headers-log
      - --state-directory
      - /state
    volumes:
      - ${SCENARIO_DIR}/receiver.py:/scenario/receiver.py:ro
      - ${TEMP_DIR}/fixtures:/fixtures:ro
      - ${TEMP_DIR}/state:/state
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  agent:
    image: ${AGENT_IMAGE}
    depends_on:
      receiver:
        condition: service_healthy
    environment:
      BOOTSTRAP_FILE: /fixtures/bootstrap.json
      OPSCOTCH_LEGAL_ACCEPTED: ${OPSCOTCH_LEGAL_ACCEPTED}
      OPSCOTCH_OPTS: --accept-legal=yes
    volumes:
      - ${TEMP_DIR}/fixtures:/fixtures:ro
      - ${TEMP_DIR}/persistence:/persistence
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8081/health >/dev/null
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
