services:
  receiver:
    image: python:3.12-alpine
    command:
      - python3
      - /scenario/scenario_server.py
      - --bind-address
      - 0.0.0.0
      - --port
      - "8080"
      - --state-directory
      - /state
      - --block-seconds
      - "20"
    volumes:
      - ${SCENARIO_DIR}/scenario_server.py:/scenario/scenario_server.py:ro
      - ${FIXTURE_DIR}:/fixtures:ro
      - ${STATE_DIR}:/state
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=1).read()
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s

  agent:
    image: ${AGENT_IMAGE}
    depends_on:
      receiver:
        condition: service_healthy
    environment:
      BOOTSTRAP_FILE: /fixtures/bootstrap.json
      OPSCOTCH_LEGAL_ACCEPTED: ${OPSCOTCH_LEGAL_ACCEPTED}
      OPSCOTCH_OPTS: --accept-legal=yes
    cpus: "${AGENT_CPUS:-1}"
    mem_limit: ${AGENT_MEMORY:-512m}
    pids_limit: ${AGENT_PIDS_LIMIT:-512}
    volumes:
      - ${FIXTURE_DIR}:/fixtures:ro
      - ${PERSISTENCE_DIR}:/persistence
